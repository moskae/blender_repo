name: Generate and Deploy Blender Extensions

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Простая установка стабильной версии Blender
      - name: Install Blender
        run: |
          sudo snap install blender --classic

      # 2. Генерируем дефолтный индекс прямо в корне (как в самый первый рабочий раз)
      - name: Generate Extension Index
        run: |
          blender --command extension server-generate --repo-dir=. --html

      # 3. Безопасное исправление путей в index.json (решаем проблему 404 в Blender)
      # Команда заменит "archive_url": "vehicle_tools.zip" на "archive_url": "extensions/vehicle_tools.zip"
      - name: Fix Asset Paths for Blender
        run: |
          sed -i 's/"archive_url": "v/"archive_url": "extensions\/v/g' index.json
          cat index.json

      # 4. Публикуем корень репозитория напрямую в GitHub Pages
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # 5. Деплой сайта
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
