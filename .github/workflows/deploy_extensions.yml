name: Generate and Deploy Blender Extensions

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo snap install blender --classic

      - name: Generate Extension Index
        run: |
          blender --command extension server-generate --repo-dir=./extensions --html

      # НОВЫЙ ШАГ: Внедряем наш кастомный дизайн в сгенерированный index.html
      - name: Inject Custom Styles and Scripts
        run: |
          # Вставляем подключение style.css перед закрывающим тегом </head>
          sed -i 's|</head>|<link rel="stylesheet" href="assets/style.css"></head>|g' index.html

          # Вставляем подключение script.js перед закрывающим тегом </body>
          sed -i 's|</body>|<script src="assets/script.js"></script></body>|g' index.html

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
