name: Generate and Deploy Blender Extensions

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Скачиваем и настраиваем Blender через официальный экшен
      - name: Set up Blender
        uses: nmarulo/setup-blender@v1
        with:
          blender-version: '4.2.0'

      # Генерируем index.json и веб-страницу index.html
      - name: Generate Extension Index
        run: |
          blender --command extension server-generate --repo-dir=. --html

      # Подготавливаем файлы для деплоя
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # Публикуем сайт в GitHub Pages
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
